[tool.poetry]
name = "schedules"
version = "0.1.0"
description = "Generate Schedule FA and Schedule CG tables for Indian ITR from foreign stock holdings"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
yfinance = "^0.2.38"
pandas = "^2.0.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"

[tool.pytest.ini_options]
testpaths = ["fa/v1/tests", "fa/v2/tests", "cg/tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
